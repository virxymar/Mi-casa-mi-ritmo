<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8C9A72"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Mi casa, mi ritmo · Hogares</title><style>body{margin:0;background:#f7f3ed;font-family:system-ui;color:#2d2c29}main{max-width:560px;margin:auto;min-height:100vh;background:#fffdf9;padding:18px 16px 34px}.brand{font:italic 700 28px Georgia;color:#607653}.muted{font-size:13px;color:#74716a}.card{background:#fff;border:1px solid #e7e0d6;border-radius:18px;padding:15px;margin:12px 0}.hero{background:#fff9f6}h1,h2,p{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.btn,.mini,.chip{border:0;border-radius:13px;padding:10px 13px;background:#83936d;color:#fff;font-weight:800}.mini,.chip{background:#fff;color:#607653;border:1px solid #cfc9bf}.chip.on{background:#83936d;color:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px}.home.active{border:2px solid #a9b79c}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #e7e0d6;border-radius:12px;font:inherit;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px dashed #ddd4c9;border-radius:14px;padding:11px;margin:9px 0}.step{display:inline-block;background:#e8eee1;color:#57704d;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.bar{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:#83936d}.check{display:flex;gap:8px;align-items:center;padding:8px 0}.check input{width:auto}.counter,.workrow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #eee}.counter input{text-align:center}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="brand">Mi casa, mi ritmo 🏠</div><div class="muted">Tu casa organizada alrededor de tu vida.</div><div id="app"></div></main><script>
const HS='mcb_v2_homes',AS='mcb_v2_active_home',app=document.getElementById('app'),uid=()=> 'h'+Date.now()+Math.random().toString(36).slice(2,5),pid=()=> 'p'+Date.now()+Math.random().toString(36).slice(2,5),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),DAYS=[[1,'Lunes'],[2,'Martes'],[3,'Miércoles'],[4,'Jueves'],[5,'Viernes'],[6,'Sábado'],[0,'Domingo']];
if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
function blank(){return{id:uid(),name:'Mi hogar',usageType:'home',workSchedule:{type:'home',minutesByDay:{}},residents:{adults:1,teens:0,children:0,babies:0,seniors:0},people:[{id:pid(),name:'Yo',participation:'Normal',availability:'Normal'}],rooms:{bedrooms:2,bathrooms:1,toilets:0,living:true,kitchen:true,laundryArea:true,terrace:false,storage:false,privateGarage:false},homeType:'Piso',heating:'Gas',streetShoes:'Sí',pets:{dog:0,cat:0,other:0},laundry:{ironing:'Algunas prendas',dryer:false},organization:{minutes:60,style:'Flexible',days:[1,2,3,4,5]}}}
function normalize(h){h.rooms=h.rooms||{};h.residents=h.residents||{adults:1,teens:0,children:0,babies:0,seniors:0};h.people=Array.isArray(h.people)&&h.people.length?h.people:[{id:pid(),name:'Yo',participation:'Normal',availability:'Normal'}];h.pets=h.pets||{dog:0,cat:0,other:0};h.laundry=h.laundry||{ironing:'Algunas prendas',dryer:false};h.organization=h.organization||{minutes:60,style:'Flexible',days:[1,2,3,4,5]};h.usageType=h.usageType||(h.workSchedule&&h.workSchedule.type==='work'?'work':'home');h.workSchedule=h.workSchedule||{type:h.usageType,minutesByDay:{}};h.workSchedule.type=h.usageType;h.workSchedule.minutesByDay=h.workSchedule.minutesByDay||{};return h}
function load(){try{return JSON.parse(localStorage.getItem(HS)||'[]').map(normalize)}catch(e){return[]}}let homes=load(),active=localStorage.getItem(AS)||'',S=null,step=-1;
function saveAll(){localStorage.setItem(HS,JSON.stringify(homes));localStorage.setItem(AS,active)}function stateKey(id,k){return'mcb_home_'+id+'_'+k}function saveCurrent(){if(!active)return;[['today','mcb_v2_today'],['house','mcb_v2_house'],['laundry','mcb_v2_laundry'],['shop','mcb_v2_shop'],['people','mcb_v2_people']].forEach(x=>{let v=localStorage.getItem(x[1]);if(v)localStorage.setItem(stateKey(active,x[0]),v)})}function loadHomeState(id){[['today','mcb_v2_today'],['house','mcb_v2_house'],['laundry','mcb_v2_laundry'],['shop','mcb_v2_shop'],['people','mcb_v2_people']].forEach(x=>{let v=localStorage.getItem(stateKey(id,x[0]));v?localStorage.setItem(x[1],v):localStorage.removeItem(x[1])})}
if(!homes.length){try{let h=JSON.parse(localStorage.getItem('mcb_v2_home')||'null');if(h){h=normalize(h);h.id=h.id||uid();homes=[h];active=h.id;saveAll()}}catch(e){}}
function read(){if(!S)return;let e=document.getElementById('homeName');if(e)S.name=e.value.trim()||'Mi hogar';document.querySelectorAll('[data-person]').forEach(e=>{let p=S.people.find(x=>x.id===e.dataset.person);if(p)p.name=e.value.trim()});['adults','teens','children','babies','seniors'].forEach(k=>{let e=document.getElementById('res_'+k);if(e)S.residents[k]=Math.max(0,+e.value||0)});['bedrooms','bathrooms','toilets'].forEach(k=>{let e=document.getElementById(k);if(e)S.rooms[k]=Math.max(0,+e.value||0)});['dog','cat','other'].forEach(k=>{let e=document.getElementById(k);if(e)S.pets[k]=Math.max(0,+e.value||0)});['living','kitchen','laundryArea','terrace','storage','privateGarage'].forEach(k=>{let e=document.getElementById(k);if(e)S.rooms[k]=e.checked});let dr=document.getElementById('dryer');if(dr)S.laundry.dryer=dr.checked;let m=document.getElementById('minutes');if(m)S.organization.minutes=+m.value||60;document.querySelectorAll('[data-workday]').forEach(e=>S.workSchedule.minutesByDay[e.dataset.workday]=+e.value||0);S.workSchedule.type=S.usageType;S.organization.days=S.usageType==='work'?DAYS.filter(x=>(+S.workSchedule.minutesByDay[x[0]]||0)>0).map(x=>x[0]):S.organization.days}
function set(path,val){read();let o=S,p=path.split('.');p.slice(0,-1).forEach(k=>o=o[k]);o[p.at(-1)]=val;if(path==='usageType'){S.workSchedule.type=val;if(val==='work'&&!Object.values(S.workSchedule.minutesByDay).some(Number))S.workSchedule.minutesByDay={1:240,2:240,3:240,4:240,5:240,6:0,0:0}}render()}
function nav(d){read();step=Math.max(0,Math.min(5,step+d));render();scrollTo(0,0)}function newHome(){S=blank();step=0;render()}function editHome(id){S=JSON.parse(JSON.stringify(homes.find(x=>x.id===id)));normalize(S);step=0;render()}function homeList(){S=null;step=-1;render()}function del(id){homes=homes.filter(x=>x.id!==id);if(active===id)active=homes[0]?.id||'';saveAll();render()}function enter(id){let h=homes.find(x=>x.id===id);if(!h)return;saveCurrent();active=id;saveAll();localStorage.setItem('mcb_v2_home',JSON.stringify(h));loadHomeState(id);location.href='./index.html?home='+encodeURIComponent(id)+'&v=20'}
function residentCount(h){return Object.values(h.residents||{}).reduce((a,b)=>a+(+b||0),0)}function addPerson(){read();S.people.push({id:pid(),name:'',participation:'Normal',availability:'Normal'});render()}function remPerson(id){read();if(S.people.length>1)S.people=S.people.filter(x=>x.id!==id);render()}function pset(id,k,v){read();let p=S.people.find(x=>x.id===id);if(p)p[k]=v;render()}function chips(path,current,vals){return'<div class="chips">'+vals.map(v=>'<button class="chip '+(current===v?'on':'')+'" onclick="set(\''+path+'\',\''+v+'\')">'+v+'</button>').join('')+'</div>'}
function head(t){return'<div class="card hero"><span class="step">PASO '+(step+1)+' DE 6</span><h1 style="margin-top:8px">'+t+'</h1><div class="bar"><span style="width:'+((step+1)*100/6)+'%"></span></div></div>'}function foot(){return'<div class="card row"><button class="mini" onclick="'+(step?'nav(-1)':'homeList()')+'">← '+(step?'Atrás':'Mis hogares')+'</button>'+(step<5?'<button class="btn" onclick="nav(1)">Continuar →</button>':'')+'</div>'}
function workOptions(v){let a=[0,60,90,120,150,180,210,240,270,300,360,420,480];return a.map(m=>'<option value="'+m+'" '+(+v===m?'selected':'')+'>'+(m?((m/60)%1?(Math.floor(m/60)+' h '+m%60+' min'):(m/60)+' h'):'No voy')+'</option>').join('')}function workScheduleHTML(){return'<div class="card"><h2>🗓️ Horario de esta vivienda</h2><p class="muted" style="margin:6px 0 8px">Indica cuánto dura tu jornada aquí cada día. Puedes tener 4 horas unos días y 8 horas otros.</p>'+DAYS.map(d=>'<div class="workrow"><b>'+d[1]+'</b><select data-workday="'+d[0]+'">'+workOptions(S.workSchedule.minutesByDay[d[0]]||0)+'</select></div>').join('')+'</div>'}
function renderList(){app.innerHTML='<div class="card hero"><h1>🏠 Mis viviendas</h1><p class="muted" style="margin-top:6px">Aquí puedes tener tanto tu casa como los domicilios en los que trabajas.</p></div>'+homes.map(h=>'<div class="card home '+(h.id===active?'active':'')+'"><div class="row"><div><b>'+(h.usageType==='work'?'🧽 ':'🏠 ')+esc(h.name)+'</b><div class="muted">'+(h.usageType==='work'?'Domicilio de trabajo':'Mi propio hogar')+(h.id===active?' · última usada':'')+'</div></div><button class="btn" onclick="enter(\''+h.id+'\')">Entrar →</button></div><div style="margin-top:10px"><button class="mini" onclick="editHome(\''+h.id+'\')">Editar</button> <button class="mini" onclick="del(\''+h.id+'\')">Eliminar</button></div></div>').join('')+'<button class="btn" style="width:100%" onclick="newHome()">＋ Añadir otra vivienda</button>'}
function person(p,i){return'<div class="person"><div class="row"><b>🧹 Persona '+(i+1)+'</b>'+(S.people.length>1?'<button class="mini" onclick="remPerson(\''+p.id+'\')">Quitar</button>':'')+'</div><label>Nombre</label><input data-person="'+p.id+'" value="'+esc(p.name)+'"><label>Participación</label>'+['No participa','Poco','Tareas sencillas','Normal','Bastante'].map(v=>'<button class="chip '+(p.participation===v?'on':'')+'" onclick="pset(\''+p.id+'\',\'participation\',\''+v+'\')">'+v+'</button>').join('')+'</div>'}
function render(){if(step<0)return renderList();if(step===0){app.innerHTML=head('Primero: ¿para qué usas esta vivienda?')+'<div class="card"><label>¿Cómo quieres llamarla?</label><input id="homeName" value="'+esc(S.name)+'"><label>Esta vivienda es…</label><div class="chips"><button class="chip '+(S.usageType==='home'?'on':'')+'" onclick="set(\'usageType\',\'home\')">🏠 Mi propio hogar</button><button class="chip '+(S.usageType==='work'?'on':'')+'" onclick="set(\'usageType\',\'work\')">🧽 Trabajo limpiando aquí</button></div></div>'+(S.usageType==='work'?workScheduleHTML():'<div class="card"><h2>🏠 Organización doméstica</h2><p class="muted">La app repartirá las tareas pensando en tu vida diaria y en no cargarte de trabajo.</p></div>')+foot();return}if(step===1){app.innerHTML=head('¿Cómo es la vivienda?')+'<div class="card grid"><div><label>Dormitorios</label><input id="bedrooms" type="number" value="'+S.rooms.bedrooms+'"></div><div><label>Baños</label><input id="bathrooms" type="number" value="'+S.rooms.bathrooms+'"></div><div><label>Aseos</label><input id="toilets" type="number" value="'+S.rooms.toilets+'"></div></div><div class="card">'+[['living','Salón / comedor'],['kitchen','Cocina'],['laundryArea','Zona de lavado'],['terrace','Terraza / balcón'],['storage','Trastero'],['privateGarage','Cochera particular']].map(x=>'<label class="check"><input type="checkbox" id="'+x[0]+'" '+(S.rooms[x[0]]?'checked':'')+'> '+x[1]+'</label>').join('')+'</div>'+foot();return}if(step===2){app.innerHTML=head('Personas')+'<div class="card"><h2>🏠 ¿Quién vive aquí?</h2>'+[['adults','Adultos'],['teens','Adolescentes'],['children','Niños'],['babies','Bebés'],['seniors','Personas mayores']].map(x=>'<div class="counter"><b>'+x[1]+'</b><input id="res_'+x[0]+'" type="number" min="0" value="'+S.residents[x[0]]+'"></div>').join('')+'</div><div class="card"><h2>🧹 ¿Quién hace las tareas?</h2>'+S.people.map(person).join('')+'<button class="mini" onclick="addPerson()">＋ Añadir persona</button></div>'+foot();return}if(step===3){app.innerHTML=head('Detalles')+'<div class="card"><label>Tipo de vivienda</label>'+chips('homeType',S.homeType,['Piso','Dúplex','Casa / chalet','Adosado','Casa rural'])+'<label>Calefacción</label>'+chips('heating',S.heating,['Gas','Eléctrica','Central','Pellets / leña','Otra','No hay'])+'<label>¿Se entra con zapatos de calle?</label>'+chips('streetShoes',S.streetShoes,['Sí','A veces','No'])+'</div>'+foot();return}if(step===4){app.innerHTML=head('Mascotas y colada')+'<div class="card grid"><div><label>Perros</label><input id="dog" type="number" value="'+S.pets.dog+'"></div><div><label>Gatos</label><input id="cat" type="number" value="'+S.pets.cat+'"></div><div><label>Otras mascotas</label><input id="other" type="number" value="'+S.pets.other+'"></div></div><div class="card"><label>¿Sueles planchar?</label>'+chips('laundry.ironing',S.laundry.ironing,['No','Algunas prendas','Sí, bastante'])+'<label class="check"><input type="checkbox" id="dryer" '+(S.laundry.dryer?'checked':'')+'> Hay secadora</label></div>'+foot();return}let final=S.usageType==='work'?'<div class="card"><h2>🧽 Plan profesional</h2><p class="muted">Hoy usará el horario que has marcado para esta vivienda. Los días con “No voy” no deben generar una jornada de trabajo.</p></div>':'<div class="card"><label>Tiempo máximo orientativo en un día normal</label><select id="minutes">'+[30,60,90,120,150,180,210,240].map(m=>'<option value="'+m+'" '+(S.organization.minutes===m?'selected':'')+'>'+m+' min</option>').join('')+'</select><label>Estilo</label>'+chips('organization.style',S.organization.style,['Flexible','Prefiero rutina'])+'</div>';app.innerHTML=head('Último paso')+final+'<div class="card"><h2>Resumen</h2><p class="muted">'+(S.usageType==='work'?'🧽 Domicilio de trabajo':'🏠 Mi propio hogar')+' · '+S.rooms.bedrooms+' dormitorios · '+S.rooms.bathrooms+' baños</p></div><div class="card row"><button class="mini" onclick="nav(-1)">← Atrás</button><button class="btn" onclick="finish()">Guardar y entrar →</button></div>'}
function finish(){read();normalize(S);let i=homes.findIndex(x=>x.id===S.id);if(i<0)homes.push(S);else homes[i]=S;active=S.id;saveAll();localStorage.setItem('mcb_v2_home',JSON.stringify(S));loadHomeState(S.id);location.href='./index.html?home='+encodeURIComponent(S.id)+'&v=20'}render();
</script></body></html>
