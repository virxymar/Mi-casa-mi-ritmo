<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8C9A72"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Mi casa, mi ritmo · Hogares</title><style>body{margin:0;background:#f7f3ed;font-family:system-ui;color:#2d2c29}main{max-width:560px;margin:auto;min-height:100vh;background:#fffdf9;padding:18px 16px 34px}.brand{font:italic 700 28px Georgia;color:#607653}.muted{font-size:13px;color:#74716a}.card{background:#fff;border:1px solid #e7e0d6;border-radius:18px;padding:15px;margin:12px 0}.hero{background:#fff9f6}h1,h2,p{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.btn,.mini,.chip{border:0;border-radius:13px;padding:10px 13px;background:#83936d;color:#fff;font-weight:800}.mini,.chip{background:#fff;color:#607653;border:1px solid #cfc9bf}.chip.on{background:#e8eee1}.chips{display:flex;flex-wrap:wrap;gap:7px}.home.active{border:2px solid #a9b79c}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #e7e0d6;border-radius:12px;font:inherit;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px dashed #ddd4c9;border-radius:14px;padding:11px;margin:9px 0}.step{display:inline-block;background:#e8eee1;color:#57704d;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.bar{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:#83936d}.check{display:flex;gap:8px;align-items:center;padding:8px 0}.check input{width:auto}.counter{display:grid;grid-template-columns:1fr 82px;gap:10px;align-items:center;padding:8px 0}.counter input{text-align:center}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="brand">Mi casa, mi ritmo 🏠</div><div class="muted">Tu casa organizada alrededor de tu vida.</div><div id="app"></div></main><script>
const HS='mcb_v2_homes',AS='mcb_v2_active_home',app=document.getElementById('app'),uid=()=> 'h'+Date.now()+Math.random().toString(36).slice(2,5),pid=()=> 'p'+Date.now()+Math.random().toString(36).slice(2,5),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ALLDAYS=[1,2,3,4,5,6,0];let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;renderInstall()});window.addEventListener('appinstalled',()=>{installPrompt=null;renderInstall(true)});if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}async function installApp(){if(!installPrompt)return;installPrompt.prompt();try{await installPrompt.userChoice}catch(_){}installPrompt=null;renderInstall()}function installHTML(){if(isStandalone())return'<div class="card" id="startInstall"><h2>📲 Aplicación instalada</h2><p class="muted" style="margin-top:6px">Ya puedes abrir Mi casa, mi ritmo desde el icono de tu móvil.</p></div>';return'<div class="card" id="startInstall"><h2>📲 Instalar en este móvil</h2><p class="muted" style="margin-top:6px">Puedes instalar la aplicación antes de crear ningún hogar.</p><button class="btn" id="startInstallBtn" style="width:100%;margin-top:10px" onclick="installApp()" '+(installPrompt?'':'disabled')+'>'+(installPrompt?'Instalar ahora':'Preparando instalación…')+'</button><p class="muted" style="margin-top:7px">Cuando el navegador la tenga preparada, el botón se activará automáticamente.</p></div>'}function renderInstall(){let old=document.getElementById('startInstall');if(old)old.outerHTML=installHTML()}
function blank(){return{id:uid(),name:'Mi hogar',residents:{adults:1,teens:0,children:0,babies:0,seniors:0},people:[{id:pid(),name:'Yo',participation:'Normal',availability:'Normal'}],rooms:{bedrooms:2,bathrooms:1,toilets:0,living:true,kitchen:true,laundryArea:true,terrace:false,storage:false,privateGarage:false},homeType:'Piso',heating:'Gas',streetShoes:'Sí',pets:{dog:0,cat:0,other:0},laundry:{ironing:'Algunas prendas',dryer:false},organization:{minutes:60,style:'Flexible',days:[1,2,3,4,5]}}}function normalize(h){h.rooms=h.rooms||{};h.people=Array.isArray(h.people)?h.people:[];h.people.forEach(p=>{p.participation=p.participation||'Normal';p.availability=p.availability||'Normal'});if(!h.residents){h.residents={adults:0,teens:0,children:0,babies:0,seniors:0};(h.people||[]).forEach(p=>{let r=p.role||'Adulto';if(r==='Bebé')h.residents.babies++;else if(r==='Niño')h.residents.children++;else if(r==='Adolescente')h.residents.teens++;else if(r==='Persona mayor')h.residents.seniors++;else h.residents.adults++})}['adults','teens','children','babies','seniors'].forEach(k=>h.residents[k]=Math.max(0,Number(h.residents[k])||0));h.organization=h.organization||{minutes:60,style:'Flexible'};if(!Array.isArray(h.organization.days)||!h.organization.days.length)h.organization.days=[1,2,3,4,5,6,0];if(h.rooms.privateGarage==null)h.rooms.privateGarage=!!h.rooms.garage;delete h.rooms.garage;delete h.rooms.garden;if(h.rooms.storage==null)h.rooms.storage=false;return h}function residentCount(h){let r=(h&&h.residents)||{};return['adults','teens','children','babies','seniors'].reduce((s,k)=>s+(Number(r[k])||0),0)}function load(){try{return JSON.parse(localStorage.getItem(HS)||'[]').map(normalize)}catch(e){return[]}}let homes=load(),active=localStorage.getItem(AS)||'',S=null,step=-1;function saveAll(){localStorage.setItem(HS,JSON.stringify(homes));localStorage.setItem(AS,active)}function stateKey(id,k){return'mcb_home_'+id+'_'+k}function saveCurrent(){if(!active)return;['today','house','laundry','shop','people'].forEach((n,i)=>{let k=['mcb_v2_today','mcb_v2_house','mcb_v2_laundry','mcb_v2_shop','mcb_v2_people'][i],v=localStorage.getItem(k);if(v)localStorage.setItem(stateKey(active,n),v)})}function loadHomeState(id){[['today','mcb_v2_today'],['house','mcb_v2_house'],['laundry','mcb_v2_laundry'],['shop','mcb_v2_shop'],['people','mcb_v2_people']].forEach(x=>{let v=localStorage.getItem(stateKey(id,x[0]));if(v)localStorage.setItem(x[1],v);else localStorage.removeItem(x[1])})}if(!homes.length){try{let h=JSON.parse(localStorage.getItem('mcb_v2_home')||'null');if(h){h=normalize(h);h.id=h.id||uid();homes=[h];active=h.id;saveAll()}}catch(e){}}function saveS(){normalize(S);let i=homes.findIndex(x=>x.id===S.id);if(i<0)homes.push(S);else homes[i]=S;saveAll()}function homeList(){step=-1;S=null;render()}function newHome(){S=blank();step=0;render()}function editHome(id){let h=homes.find(x=>x.id===id);if(!h)return;S=JSON.parse(JSON.stringify(h));step=0;render()}function enter(id){let h=homes.find(x=>x.id===id);if(!h)return;saveCurrent();active=id;saveAll();localStorage.setItem('mcb_v2_home',JSON.stringify(h));loadHomeState(id);location.href='./index.html?home='+encodeURIComponent(id)+'&v=10'}function del(id){homes=homes.filter(x=>x.id!==id);if(active===id)active=homes[0]?.id||'';saveAll();render()}function addPerson(){read();S.people.push({id:pid(),name:'',participation:'Normal',availability:'Normal'});render()}function remPerson(id){if(S.people.length>1){read();S.people=S.people.filter(x=>x.id!==id);render()}}function read(){if(!S)return;let e=document.getElementById('homeName');if(e)S.name=e.value.trim()||'Mi hogar';document.querySelectorAll('[data-person]').forEach(e=>{let p=S.people.find(x=>x.id===e.dataset.person);if(p)p.name=e.value.trim()});['adults','teens','children','babies','seniors'].forEach(k=>{let e=document.getElementById('res_'+k);if(e)S.residents[k]=Math.max(0,Number(e.value)||0)});['bedrooms','bathrooms','toilets','dog','cat','other'].forEach(k=>{let e=document.getElementById(k);if(e){let v=Math.max(0,Number(e.value)||0);if(k in S.rooms)S.rooms[k]=v;else S.pets[k]=v}});let m=document.getElementById('minutes');if(m)S.organization.minutes=Number(m.value)||60;['living','kitchen','laundryArea','terrace','storage','privateGarage'].forEach(k=>{let e=document.getElementById(k);if(e)S.rooms[k]=e.checked});let dr=document.getElementById('dryer');if(dr)S.laundry.dryer=dr.checked}function nav(d){read();step=Math.max(0,Math.min(5,step+d));render();scrollTo(0,0)}function set(path,val){read();let o=S,p=path.split('.');p.slice(0,-1).forEach(k=>o=o[k]);o[p[p.length-1]]=val;render()}function toggleDay(d){read();let a=S.organization.days||[];S.organization.days=a.includes(d)?a.filter(x=>x!==d):a.concat(d);if(!S.organization.days.length)S.organization.days=[d];render()}function pset(id,k,v){read();let p=S.people.find(x=>x.id===id);if(p)p[k]=v;render()}function chips(path,current,vals){return'<div class="chips">'+vals.map(v=>'<button class="chip '+(current===v?'on':'')+'" onclick="set(\''+path+'\',\''+v+'\')">'+v+'</button>').join('')+'</div>'}function dayChips(){let labs={1:'L',2:'M',3:'X',4:'J',5:'V',6:'S',0:'D'},a=S.organization.days||[];return'<div class="chips">'+ALLDAYS.map(d=>'<button class="chip '+(a.includes(d)?'on':'')+'" onclick="toggleDay('+d+')">'+labs[d]+'</button>').join('')+'</div>'}function head(t){return'<div class="card hero"><span class="step">PASO '+(step+1)+' DE 6</span><h1 style="margin-top:8px">'+t+'</h1><div class="bar"><span style="width:'+((step+1)*100/6)+'%"></span></div></div>'}function foot(){return'<div class="card row"><button class="mini" onclick="'+(step?'nav(-1)':'homeList()')+'">← '+(step?'Atrás':'Mis hogares')+'</button>'+(step<5?'<button class="btn" onclick="nav(1)">Continuar →</button>':'')+'</div>'}function renderList(){app.innerHTML='<div class="card hero"><h1>🏠 Mis hogares</h1><p class="muted" style="margin-top:6px">Elige una casa para empezar a trabajar o instala primero la aplicación en este móvil.</p></div>'+homes.map(h=>'<div class="card home '+(h.id===active?'active':'')+'"><div class="row"><div><b>'+esc(h.name||'Mi hogar')+'</b><div class="muted">'+residentCount(h)+' viven aquí · '+((h.people||[]).length||1)+' se ocupan de tareas'+(h.id===active?' · última usada':'')+'</div></div><button class="btn" onclick="enter(\''+h.id+'\')">Entrar →</button></div><div style="margin-top:10px"><button class="mini" onclick="editHome(\''+h.id+'\')">Editar</button> <button class="mini" onclick="del(\''+h.id+'\')">Eliminar</button></div></div>').join('')+'<button class="btn" style="width:100%" onclick="newHome()">＋ Añadir otro hogar</button>'+installHTML()}function person(p,i){return'<div class="person"><div class="row"><b>🧹 Persona '+(i+1)+'</b>'+(S.people.length>1?'<button class="mini" onclick="remPerson(\''+p.id+'\')">Quitar</button>':'')+'</div><label>Nombre</label><input data-person="'+p.id+'" value="'+esc(p.name)+'"><label>¿Cuánto participa en las tareas?</label><div class="chips">'+['No participa','Poco','Tareas sencillas','Normal','Bastante'].map(v=>'<button class="chip '+(p.participation===v?'on':'')+'" onclick="pset(\''+p.id+'\',\'participation\',\''+v+'\')">'+v+'</button>').join('')+'</div><label>Disponibilidad</label><div class="chips">'+['Poca','Normal','Bastante','Variable'].map(v=>'<button class="chip '+(p.availability===v?'on':'')+'" onclick="pset(\''+p.id+'\',\'availability\',\''+v+'\')">'+v+'</button>').join('')+'</div></div>'}function residentsHTML(){let rows=[['adults','Adultos'],['teens','Adolescentes'],['children','Niños'],['babies','Bebés'],['seniors','Personas mayores']];return rows.map(x=>'<div class="counter"><b>'+x[1]+'</b><input id="res_'+x[0]+'" type="number" min="0" value="'+(S.residents[x[0]]||0)+'"></div>').join('')}function render(){if(step<0)return renderList();if(step===0)app.innerHTML=head('Las personas de esta casa')+'<div class="card"><label>¿Cómo quieres llamar a esta casa?</label><input id="homeName" value="'+esc(S.name)+'"></div><div class="card"><h2>🏠 ¿Quién vive en esta casa?</h2><p class="muted" style="margin-top:6px">Indica cuántas personas viven aquí. Esto sirve para calcular la carga real de ropa, recogida, camas y uso de la casa.</p><div style="margin-top:10px">'+residentsHTML()+'</div></div><div class="card"><h2>🧹 ¿Quién se ocupa de las tareas de esta casa?</h2><p class="muted" style="margin-top:6px">Aquí sí ponemos los nombres de quienes pueden hacer tareas, vivan o no en la casa.</p>'+S.people.map(person).join('')+'<button class="mini" onclick="addPerson()">＋ Añadir persona</button></div>'+foot();else if(step===1)app.innerHTML=head('¿Cómo es la casa?')+'<div class="card grid"><div><label>Dormitorios</label><input id="bedrooms" type="number" value="'+(S.rooms.bedrooms||0)+'"></div><div><label>Baños</label><input id="bathrooms" type="number" value="'+(S.rooms.bathrooms||0)+'"></div><div><label>Aseos</label><input id="toilets" type="number" value="'+(S.rooms.toilets||0)+'"></div></div><div class="card">'+[['living','🛋️ Salón'],['kitchen','🍳 Cocina'],['laundryArea','🧺 Zona de lavado'],['terrace','🌤️ Terraza'],['storage','📦 Trastero'],['privateGarage','🚙 Cochera particular']].map(x=>'<label class="check"><input id="'+x[0]+'" type="checkbox" '+(S.rooms[x[0]]?'checked':'')+'>'+x[1]+'</label>').join('')+'</div>'+foot();else if(step===2)app.innerHTML=head('¿Cómo se vive aquí?')+'<div class="card"><label>Tipo de vivienda</label>'+chips('homeType',S.homeType,['Piso','Dúplex','Casa / chalet','Adosado','Casa rural'])+'<label>Calefacción</label>'+chips('heating',S.heating||'Gas',['Eléctrica','Gas','Gasoil','Pellets / leña','Carbón','Otra'])+'<label>¿Se entra con calzado de la calle?</label>'+chips('streetShoes',S.streetShoes||'Sí',['Sí','No'])+'</div>'+foot();else if(step===3)app.innerHTML=head('Mascotas y colada')+'<div class="card grid"><div><label>Perros</label><input id="dog" type="number" value="'+(S.pets.dog||0)+'"></div><div><label>Gatos</label><input id="cat" type="number" value="'+(S.pets.cat||0)+'"></div><div><label>Otras mascotas</label><input id="other" type="number" value="'+(S.pets.other||0)+'"></div></div><div class="card"><label>¿Se plancha?</label>'+chips('laundry.ironing',S.laundry.ironing,['No','Algunas prendas','Sí'])+'<label class="check"><input id="dryer" type="checkbox" '+(S.laundry.dryer?'checked':'')+'> Tenemos secadora</label></div>'+foot();else if(step===4)app.innerHTML=head('¿Cuándo quieres ocuparte de la casa?')+'<div class="card"><label>¿Qué días puedes dedicar a las tareas de la casa?</label>'+dayChips()+'<p class="muted" style="margin-top:8px">La app repartirá el trabajo entre estos días. Fuera de ellos solo propondrá lo imprescindible.</p><label>Máximo orientativo en uno de esos días</label><select id="minutes">'+[[30,'30 min'],[60,'1 hora'],[90,'1 h 30'],[120,'2 horas'],[150,'2 h 30'],[180,'3 horas'],[210,'3 h 30'],[240,'4 horas']].map(x=>'<option value="'+x[0]+'" '+(S.organization.minutes==x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select><label>Estilo</label>'+chips('organization.style',S.organization.style,['Flexible','Prefiero rutina'])+'</div>'+foot();else app.innerHTML=head('Ya conozco lo suficiente para empezar')+'<div class="card"><h2>'+esc(S.name)+'</h2><p class="muted" style="margin-top:6px">'+residentCount(S)+' viven aquí · '+S.people.length+' se ocupan de tareas · '+(S.rooms.bedrooms||0)+' dormitorios · '+(S.rooms.bathrooms||0)+' baños</p></div><div class="card row"><button class="mini" onclick="nav(-1)">← Revisar</button><button class="btn" onclick="finish()">Guardar y entrar →</button></div>'}function finish(){read();saveS();active=S.id;saveAll();localStorage.setItem('mcb_v2_home',JSON.stringify(S));loadHomeState(S.id);location.href='./index.html?home='+encodeURIComponent(S.id)+'&v=10'}render();</script></body></html>
