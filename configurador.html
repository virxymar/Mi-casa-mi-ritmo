<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8C9A72"><title>Mi casa, mi ritmo · Hogares</title><style>:root{--s:#83936d;--s2:#e8eee1;--bg:#f7f3ed;--paper:#fffdf9;--ink:#2d2c29;--mut:#74716a;--line:#e7e0d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:560px;margin:auto;min-height:100vh;background:var(--paper);padding:18px 16px 34px}.brand{font:italic 700 29px Georgia;color:#607653}.muted{font-size:13px;color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.hero{background:linear-gradient(145deg,#fff,#fff7f6)}h1,h2,p{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.wrap{flex-wrap:wrap}.btn,.mini,.chip{border:0;border-radius:13px;padding:10px 13px;background:var(--s);color:#fff;font-weight:800}.mini,.chip{background:#fff;color:#607653;border:1px solid #cfc9bf;padding:8px 10px}.chip.on{background:var(--s2)}label{display:block;font-size:13px;font-weight:750;margin:11px 0 5px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px dashed #ddd4c9;border-radius:14px;padding:11px;margin:9px 0}.step{display:inline-block;background:var(--s2);color:#57704d;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.bar{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin:11px 0}.bar span{display:block;height:100%;background:var(--s)}.home.active{border:2px solid #a9b79c}.footer{position:sticky;bottom:0;background:#fffdf9ef;padding:7px 0}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="brand">Mi casa, mi ritmo 🏠</div><div class="muted">Cada hogar con sus personas, tareas y ritmo.</div><div id="app"></div></main><script>
const HS='mcb_v2_homes',AS='mcb_v2_active_home';const D=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];const uid=()=> 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const pid=()=> 'p'+Math.random().toString(36).slice(2,8);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function blank(){return{id:uid(),step:0,name:'Mi hogar',homeType:'Piso',floors:1,people:[{id:pid(),name:'Yo',participation:'normal',availability:'normal'}],rooms:{bedrooms:2,bathrooms:1,toilets:0,living:true,kitchen:true,laundryArea:true},pets:{dog:0,cat:0},laundry:{ironing:'Algunas prendas',dryer:false,types:['Ropa normal']},organization:{days:['Lun','Mar','Mié','Jue','Vie'],minutes:60,style:'Flexible'}}}function homes(){try{return JSON.parse(localStorage.getItem(HS)||'[]')}catch(e){return[]}}function saveHomes(a){localStorage.setItem(HS,JSON.stringify(a))}let list=homes(),active=localStorage.getItem(AS)||'',S=null,screen='list';if(!list.length){try{let old=JSON.parse(localStorage.getItem('mcb_v2_home')||'null');if(old){old.id=old.id||uid();old.step=0;list=[old];active=old.id;saveHomes(list);localStorage.setItem(AS,active)}}catch(e){}}function persist(){let i=list.findIndex(x=>x.id===S.id);if(i>=0)list[i]=S;else list.push(S);saveHomes(list)}function manage(){screen='list';S=null;render()}function edit(id){S=JSON.parse(JSON.stringify(list.find(x=>x.id===id)));S.step=0;screen='edit';render()}function createHome(){S=blank();screen='edit';render()}function choose(id){active=id;localStorage.setItem(AS,id);let h=list.find(x=>x.id===id);localStorage.setItem('mcb_v2_home',JSON.stringify(h));localStorage.removeItem('mcb_v2_people');localStorage.removeItem('mcb_v2_today');localStorage.removeItem('mcb_v2_house');localStorage.removeItem('mcb_v2_laundry');location.href='./index.html?home='+encodeURIComponent(id)}function removeHome(id){if(!confirm('¿Eliminar este hogar?'))return;list=list.filter(x=>x.id!==id);saveHomes(list);if(active===id){active=list[0]?.id||'';localStorage.setItem(AS,active)}render()}function set(k,v){S[k]=v;persist();render()}function personSet(id,k,v){let p=S.people.find(x=>x.id===id);if(p){p[k]=v;persist();render()}}function addPerson(){S.people.push({id:pid(),name:'',participation:'normal',availability:'normal'});persist();render()}function remPerson(id){if(S.people.length>1){S.people=S.people.filter(x=>x.id!==id);persist();render()}}function read(){let e=document.getElementById('name');if(e)S.name=e.value.trim()||'Mi hogar';['floors','bedrooms','bathrooms','toilets','dog','cat','minutes'].forEach(k=>{let x=document.getElementById(k);if(x){let v=Number(x.value)||0;if(k==='floors')S.floors=Math.max(1,v);else if(['bedrooms','bathrooms','toilets'].includes(k))S.rooms[k]=v;else if(['dog','cat'].includes(k))S.pets[k]=v;else S.organization.minutes=v}});document.querySelectorAll('[data-person]').forEach(x=>{let p=S.people.find(y=>y.id===x.dataset.person);if(p)p.name=x.value.trim()});persist()}function nav(d){read();S.step=Math.max(0,Math.min(5,S.step+d));persist();render();scrollTo(0,0)}function head(t){return`<div class="card hero"><span class="step">PASO ${S.step+1} DE 6</span><h1 style="margin-top:8px">${t}</h1><div class="bar"><span style="width:${(S.step+1)*100/6}%"></span></div></div>`}function buttons(){return`<div class="footer"><div class="card row"><button class="mini" onclick="${S.step?'nav(-1)':'manage()'}">← ${S.step?'Atrás':'Mis hogares'}</button>${S.step<5?'<button class="btn" onclick="nav(1)">Continuar →</button>':''}</div></div>`}function chips(current,vals,fn){return`<div class="chips">${vals.map(v=>`<button class="chip ${current===v?'on':''}" onclick="${fn}('${v}')">${v}</button>`).join('')}</div>`}function renderList(){app.innerHTML=`<div class="card hero"><h1>🏠 Mis hogares</h1><p class="muted" style="margin-top:6px">Entra en una casa o crea otra. No hace falta volver hacia atrás por el configurador.</p></div>${list.map(h=>`<div class="card home ${h.id===active?'active':''}"><div class="row"><div><b>${esc(h.name)}</b><div class="muted">${h.people?.length||1} personas${h.id===active?' · Hogar actual':''}</div></div><button class="btn" onclick="choose('${h.id}')">Entrar</button></div><div class="chips" style="margin-top:10px"><button class="mini" onclick="edit('${h.id}')">Editar</button><button class="mini" onclick="removeHome('${h.id}')">Eliminar</button></div></div>`).join('')}<button class="btn" style="width:100%" onclick="createHome()">＋ Añadir otro hogar</button><div style="margin-top:12px"><button class="mini" onclick="location.href='./index.html'">← Volver a la app</button></div>`}function render(){if(screen==='list')return renderList();if(S.step===0)app.innerHTML=head('Empezamos por este hogar')+`<div class="card"><label>¿Cómo quieres llamar a esta casa?</label><input id="name" value="${esc(S.name)}"><h2 style="margin-top:16px">¿Quién vive o participa aquí?</h2>${S.people.map((p,i)=>`<div class="person"><div class="row"><b>👤 Persona ${i+1}</b>${S.people.length>1?`<button class="mini" onclick="remPerson('${p.id}')">Quitar</button>`:''}</div><label>Nombre</label><input data-person="${p.id}" value="${esc(p.name)}"><label>Participación</label>${chips(p.participation,["No participa","Tareas sencillas","Normal"],`v=>0`) .replaceAll("v=>0('",`personSet('${p.id}','participation','`).replaceAll("')">",`')">`)}</div>`).join('')}<button class="mini" onclick="read();addPerson()">＋ Añadir persona</button></div>`+buttons();else if(S.step===1)app.innerHTML=head('Mapa de la casa')+`<div class="card grid"><div><label>Plantas</label><input id="floors" type="number" min="1" value="${S.floors}"></div><div><label>Dormitorios</label><input id="bedrooms" type="number" min="0" value="${S.rooms.bedrooms||0}"></div><div><label>Baños completos</label><input id="bathrooms" type="number" min="0" value="${S.rooms.bathrooms||0}"></div><div><label>Aseos</label><input id="toilets" type="number" min="0" value="${S.rooms.toilets||0}"></div></div>`+buttons();else if(S.step===2)app.innerHTML=head('¿Cómo se vive aquí?')+`<div class="card"><label>Tipo de vivienda</label>${chips(S.homeType,['Piso','Casa / chalet','Adosado','Casa rural'],'set.bind(null,\'homeType\')')}</div>`+buttons();else if(S.step===3)app.innerHTML=head('Mascotas y colada')+`<div class="card grid"><div><label>Perros</label><input id="dog" type="number" min="0" value="${S.pets.dog||0}"></div><div><label>Gatos</label><input id="cat" type="number" min="0" value="${S.pets.cat||0}"></div></div><div class="card"><label>Plancha</label>${chips(S.laundry.ironing,['No','Algunas prendas','Sí'],'set.bind(null,\'laundry.ironing\')')}<p class="muted" style="margin-top:12px">Ropa normal incluida como carga habitual.</p></div>`+buttons();else if(S.step===4)app.innerHTML=head('¿Cuánto espacio quieres darle a la casa?')+`<div class="card"><label>Tiempo orientativo máximo al día</label><select id="minutes">${[[30,'30 min'],[60,'1 hora'],[90,'1 h 30'],[120,'2 horas'],[150,'2 h 30'],[180,'3 horas']].map(x=>`<option value="${x[0]}" ${S.organization.minutes==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><p class="muted" style="margin-top:12px">El tiempo orienta, no manda. La app propondrá el trabajo por ti.</p></div>`+buttons();else app.innerHTML=head('Ya conozco lo suficiente para empezar')+`<div class="card"><h2>${esc(S.name)}</h2><p class="muted">${S.people.length} personas · ${S.rooms.bedrooms||0} dormitorios · ${S.rooms.bathrooms||0} baños</p></div><div class="card row"><button class="mini" onclick="nav(-1)">← Revisar</button><button class="btn" onclick="finish()">Guardar y entrar →</button></div>`}function finish(){read();S.step=0;persist();active=S.id;localStorage.setItem(AS,active);localStorage.setItem('mcb_v2_home',JSON.stringify(S));localStorage.removeItem('mcb_v2_people');localStorage.removeItem('mcb_v2_today');localStorage.removeItem('mcb_v2_house');localStorage.removeItem('mcb_v2_laundry');location.href='./index.html?home='+encodeURIComponent(active)}render();</script></body></html>
