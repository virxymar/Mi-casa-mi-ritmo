<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8C9A72"><title>Mi casa, mi ritmo · Configurador</title><style>
:root{--sage:#83936d;--sage2:#e8eee1;--cream:#f7f3ed;--paper:#fffdf9;--ink:#2d2c29;--mut:#74716a;--line:#e7e0d6;--warn:#fff3d7}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:560px;margin:auto;min-height:100vh;background:var(--paper);padding:18px 16px 34px}.brand{font:italic 700 29px Georgia,serif;color:#607653}.sub,.muted{font-size:13px;color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:13px 0;box-shadow:0 2px 12px #00000006}.hero{background:linear-gradient(145deg,#fff,#fff7f6)}h1{font-size:25px;line-height:1.15;margin:7px 0}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:15px 0 8px}.step{display:inline-block;background:var(--sage2);color:#57704d;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:var(--sage)}label{display:block;font-size:13px;font-weight:750;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row{display:flex;justify-content:space-between;gap:9px;align-items:center}.wrap{flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 14px;background:var(--sage);color:#fff;font-weight:800;font:inherit}.btn.alt{background:#fff;color:#607653;border:1px solid #aebaa3}.btn.soft{background:var(--sage2);color:#536c49}.btn:disabled{opacity:.35}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip,.radioBtn{border:1px solid #d5cec4;background:#fff;padding:9px 11px;border-radius:99px;font-weight:700;color:var(--ink)}.chip.on,.radioBtn.on{background:var(--sage2);border-color:#a9b79c;color:#536c49}.radioGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.radioBtn{border-radius:13px;text-align:center}.notice{background:#f5f0e8;border-radius:14px;padding:12px;font-size:13px;line-height:1.4}.person{border:1px dashed #ddd4c9;border-radius:15px;padding:12px;margin:9px 0}.personHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.mini{font-size:11px;padding:6px 8px;border-radius:99px;border:1px solid #cfc9bf;background:#fff;color:#607653;font-weight:800}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff}.big{font-size:24px}.checkline{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px dashed #eee}.checkline:last-child{border-bottom:0}.checkline input{width:auto}.footerBtns{position:sticky;bottom:0;background:#fffdf9eF;backdrop-filter:blur(8px);padding:8px 0 4px}.smallTitle{font-size:12px;font-weight:900;color:#607653;text-transform:uppercase;letter-spacing:.03em}.hr{height:1px;background:var(--line);margin:13px 0}@media(max-width:390px){.twocol,.summary,.radioGrid{grid-template-columns:1fr}.brand{font-size:27px}}
</style></head><body><main><div class="brand">Mi casa, mi ritmo 🏠</div><div class="sub">Configurador de tu hogar · primero tu vida, después la casa</div><div id="app"></div></main><script>
const STORE='mcb_v2_home_draft',D=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];function uid(){return'p'+Math.random().toString(36).slice(2,9)}
const defaultState=()=>({step:0,name:'Mi hogar',homeType:'Piso',floors:1,people:[{id:uid(),name:'Yo',role:'adulto',participation:'normal',availability:'normal',limits:[]}],rooms:{bedrooms:2,bathrooms:1,toilets:0,living:true,kitchen:true,office:false,terrace:false,balcony:false,patio:false,garden:false,garage:false,storage:false,laundryArea:true,stairs:false},lifestyle:{streetShoes:'Sí',heating:'Gas',waterHardness:'No lo sé'},pets:{dog:0,cat:0,bird:0,other:0},laundry:{ironing:'Algunas prendas',dryer:false,loads:'normal',types:[]},organization:{days:['Lun','Mar','Mié','Jue','Vie'],minutes:60,style:'Flexible'},later:{},createdAt:new Date().toISOString()});let S=load();function load(){try{let x=Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORE)||'null')||{});if(x.laundry.ironing==='algunas')x.laundry.ironing='Algunas prendas';if(x.organization.style==='flexible')x.organization.style='Flexible';return x}catch(e){return defaultState()}}function save(){localStorage.setItem(STORE,JSON.stringify(S))}function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function set(path,val){let o=S,p=path.split('.');p.slice(0,-1).forEach(k=>o=o[k]);o[p.at(-1)]=val;save();render()}function toggle(a,v){let i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);save();render()}function n(id,min=0){return Math.max(min,Number(document.getElementById(id)?.value)||0)}function checked(id){return!!document.getElementById(id)?.checked}function read(){if(S.step===0)S.name=(homeName?.value||'').trim()||'Mi hogar';if(S.step===1){S.rooms.bedrooms=n('bedrooms');S.rooms.bathrooms=n('bathrooms');S.rooms.toilets=n('toilets');S.floors=n('floors',1);['living','kitchen','office','terrace','balcony','patio','garden','garage','storage','laundryArea','stairs'].forEach(k=>S.rooms[k]=checked(k))}if(S.step===3){['dog','cat','bird','other'].forEach(k=>S.pets[k]=n(k));S.laundry.dryer=checked('dryer')}if(S.step===4)S.organization.minutes=Number(minutes?.value||60);save()}function nav(d){read();S.step=Math.max(0,Math.min(5,S.step+d));save();render();scrollTo({top:0,behavior:'smooth'})}function head(t,x){return`<div class="card hero"><span class="step">PASO ${S.step+1} DE 6</span><h1>${t}</h1><div class="muted">${x}</div><div class="bar"><span style="width:${(S.step+1)*100/6}%"></span></div></div>`}function buttons(){return`<div class="footerBtns"><div class="card row"><button class="btn alt" onclick="nav(-1)" ${S.step===0?'disabled':''}>← Atrás</button>${S.step<5?'<button class="btn" onclick="nav(1)">Continuar →</button>':''}</div></div>`}function boolLine(id,l){return`<label class="checkline"><input id="${id}" type="checkbox" ${S.rooms[id]?'checked':''}><span>${l}</span></label>`}function choice(path,current,items){return`<div class="radioGrid">${items.map(x=>`<button class="radioBtn ${current===x?'on':''}" onclick="set('${path}','${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div>`}function addPerson(){S.people.push({id:uid(),name:'',role:'adulto',participation:'normal',availability:'normal',limits:[]});save();render()}function removePerson(id){if(S.people.length===1)return;S.people=S.people.filter(p=>p.id!==id);save();render()}function personSet(id,k,v){let p=S.people.find(x=>x.id===id);if(p){p[k]=v;save();render()}}function personInput(id,v){let p=S.people.find(x=>x.id===id);if(p){p.name=v;save()}}function personCard(p,i){return`<div class="person"><div class="personHead"><b>👤 Persona ${i+1}</b>${S.people.length>1?`<button class="mini" onclick="removePerson('${p.id}')">Quitar</button>`:''}</div><label>Nombre</label><input value="${esc(p.name)}" placeholder="Ej.: Félix" oninput="personInput('${p.id}',this.value)"><label>Participación en casa</label><div class="chips">${[['no','No participa'],['sencilla','Tareas sencillas'],['normal','Normal']].map(([v,t])=>`<button class="chip ${p.participation===v?'on':''}" onclick="personSet('${p.id}','participation','${v}')">${t}</button>`).join('')}</div><label>Disponibilidad habitual</label><div class="chips">${[['poca','Poca'],['normal','Normal'],['bastante','Bastante'],['variable','Variable']].map(([v,t])=>`<button class="chip ${p.availability===v?'on':''}" onclick="personSet('${p.id}','availability','${v}')">${t}</button>`).join('')}</div></div>`}function petTotal(){return Object.values(S.pets).reduce((a,b)=>a+(Number(b)||0),0)}function peopleActive(){return S.people.filter(p=>p.participation!=='no').length}function roomCount(){let r=S.rooms.bedrooms+S.rooms.bathrooms+S.rooms.toilets;['living','kitchen','office','terrace','balcony','patio','garden','garage','storage','laundryArea'].forEach(k=>r+=S.rooms[k]?1:0);return r}
function render(){if(S.step===0)app.innerHTML=head('Empezamos por tu hogar','Solo lo imprescindible. Después iremos afinando cuando haga falta.')+`<div class="card"><label>¿Cómo quieres llamar a esta casa?</label><input id="homeName" value="${esc(S.name)}" placeholder="Ej.: Casa de León"><h3>¿Quién vive o participa aquí?</h3>${S.people.map(personCard).join('')}<button class="btn soft" onclick="addPerson()">＋ Añadir persona</button><div class="notice" style="margin-top:12px">👥 Tendremos en cuenta quién puede ayudar y cuánto tiempo tiene, sin rankings ni reproches.</div></div>`+buttons();else if(S.step===1)app.innerHTML=head('Ahora, el mapa de la casa','Marcamos lo que existe para adaptar las tareas a tu casa real.')+`<div class="card"><div class="twocol"><div><label>Plantas</label><input id="floors" type="number" min="1" value="${S.floors}"></div><div><label>Dormitorios</label><input id="bedrooms" type="number" min="0" value="${S.rooms.bedrooms}"></div><div><label>Baños completos</label><input id="bathrooms" type="number" min="0" value="${S.rooms.bathrooms}"></div><div><label>Aseos</label><input id="toilets" type="number" min="0" value="${S.rooms.toilets}"></div></div><h3>Otras zonas</h3>${boolLine('living','🛋️ Salón / comedor')}${boolLine('kitchen','🍳 Cocina')}${boolLine('office','💻 Despacho')}${boolLine('laundryArea','🧺 Zona de lavado')}${boolLine('terrace','🌤️ Terraza')}${boolLine('balcony','🏙️ Balcón')}${boolLine('patio','🌿 Patio')}${boolLine('garden','🌳 Jardín')}${boolLine('garage','🚗 Garaje')}${boolLine('storage','📦 Trastero')}${boolLine('stairs','🪜 Escaleras')}</div>`+buttons();else if(S.step===2)app.innerHTML=head('¿Cómo se vive aquí?','Unos pocos datos que cambian la frecuencia real de las tareas.')+`<div class="card"><label>Tipo de vivienda</label>${choice('homeType',S.homeType,['Piso','Casa / chalet','Adosado','Casa rural'])}<label>Calefacción principal</label>${choice('lifestyle.heating',S.lifestyle.heating,['Eléctrica','Gas','Gasoil','Pellets / leña','Carbón','Otra'])}<label>¿Se entra normalmente con calzado de la calle?</label>${choice('lifestyle.streetShoes',S.lifestyle.streetShoes,['Sí','No'])}<label>¿Cómo dirías que es el agua?</label>${choice('lifestyle.waterHardness',S.lifestyle.waterHardness,['Blanda','Media','Dura','No lo sé'])}<div class="notice" style="margin-top:12px">💧 Si no sabes cómo es el agua, no pasa nada. Podrás cambiarlo después.</div></div>`+buttons();else if(S.step===3)app.innerHTML=head('Mascotas y colada','Solo lo que cambia la carga real de la casa.')+`<div class="card"><h2>🐾 Mascotas</h2><div class="twocol"><div><label>Perros</label><input id="dog" type="number" min="0" value="${S.pets.dog}"></div><div><label>Gatos</label><input id="cat" type="number" min="0" value="${S.pets.cat}"></div><div><label>Aves</label><input id="bird" type="number" min="0" value="${S.pets.bird}"></div><div><label>Otras</label><input id="other" type="number" min="0" value="${S.pets.other}"></div></div><div class="hr"></div><h2>🧺 Colada</h2><label>¿Se plancha?</label>${choice('laundry.ironing',S.laundry.ironing,['No','Algunas prendas','Sí'])}<label class="checkline"><input id="dryer" type="checkbox" ${S.laundry.dryer?'checked':''}><span>🌬️ Tenemos secadora</span></label><label>¿Qué suele haber?</label><div class="chips">${['Ropa normal','Ropa de bebé','Uniformes / trabajo','Ropa delicada','Mucha ropa de cama','Manchas frecuentes'].map(x=>`<button class="chip ${S.laundry.types.includes(x)?'on':''}" onclick="toggle(S.laundry.types,'${x}')">${x}</button>`).join('')}</div><div class="notice" style="margin-top:12px">🧽 Si marcas manchas frecuentes, podremos tenerlo en cuenta y consultar la biblioteca de limpieza cuando sea necesario.</div></div>`+buttons();else if(S.step===4)app.innerHTML=head('¿Cuánto espacio quieres darle a la casa?','El tiempo orienta, no manda. Habrá días normales y otros de limpieza más grande.')+`<div class="card"><label>Días en los que normalmente se puede hacer algo</label><div class="chips">${D.map(x=>`<button class="chip ${S.organization.days.includes(x)?'on':''}" onclick="toggle(S.organization.days,'${x}')">${x}</button>`).join('')}</div><label>Tiempo orientativo máximo al día</label><select id="minutes">${[[20,'≈ 20 min'],[30,'≈ 30 min'],[60,'≈ 1 hora'],[90,'≈ 1 h 30'],[120,'≈ 2 horas'],[150,'≈ 2 h 30'],[180,'≈ 3 horas']].map(x=>`<option value="${x[0]}" ${S.organization.minutes==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><label>Estilo</label>${choice('organization.style',S.organization.style,['Flexible','Prefiero rutina'])}<div class="notice">⚡ En el día a día podrás indicar cuánto tiempo tienes y la app ajustará lo que te propone.</div></div>`+buttons();else app.innerHTML=result()}
function result(){let active=peopleActive(),pets=petTotal(),rooms=roomCount();return head('Ya conozco lo suficiente para empezar','Con esto ya podemos organizar la casa. Los detalles se podrán completar más adelante cuando sean útiles.')+`<div class="card"><div class="smallTitle">${esc(S.name)}</div><div class="summary" style="margin-top:10px"><div class="tile"><div class="big">👥 ${S.people.length}</div><div class="muted">personas · ${active} participan</div></div><div class="tile"><div class="big">🏠 ${rooms}</div><div class="muted">zonas aprox.</div></div><div class="tile"><div class="big">🐾 ${pets}</div><div class="muted">mascotas</div></div><div class="tile"><div class="big">⏱️ ${S.organization.minutes}</div><div class="muted">min orientativos/día</div></div></div></div><div class="card"><h2>🏠 Todo preparado</h2><div class="checkline">✅ <span>Limpieza adaptada a las estancias reales</span></div><div class="checkline">✅ <span>Colada y tareas periódicas</span></div><div class="checkline">✅ <span>Reparto según personas y disponibilidad</span></div><div class="checkline">✅ <span>Comidas y compra</span></div></div><div class="card"><div class="row wrap"><button class="btn alt" onclick="nav(-1)">← Revisar</button><button class="btn" onclick="finish()">Guardar y entrar →</button></div></div>`}function finish(){read();localStorage.setItem('mcb_v2_home',JSON.stringify(S));location.href='./index.html?from=config'}render();
</script></body></html>
