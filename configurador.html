<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi casa, mi ritmo · Hogares</title><style>body{margin:0;background:#f7f3ed;font-family:system-ui;color:#2d2c29}main{max-width:560px;margin:auto;min-height:100vh;background:#fffdf9;padding:18px 16px}.brand{font:italic 700 29px Georgia;color:#607653}.muted{font-size:13px;color:#74716a}.card{background:#fff;border:1px solid #e7e0d6;border-radius:18px;padding:15px;margin:12px 0}.hero{background:#fff9f6}h1,h2,p{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.btn,.mini{border:0;border-radius:13px;padding:10px 13px;background:#83936d;color:#fff;font-weight:800}.mini{background:#fff;color:#607653;border:1px solid #cfc9bf}.home.active{border:2px solid #a9b79c}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input{width:100%;padding:11px;border:1px solid #e7e0d6;border-radius:12px;font:inherit;box-sizing:border-box}</style></head><body><main><div class="brand">Mi casa, mi ritmo 🏠</div><div class="muted">Tu casa organizada alrededor de tu vida.</div><div id="app"></div></main><script>const HS='mcb_v2_homes',AS='mcb_v2_active_home';const app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=> 'h'+Date.now()+Math.random().toString(36).slice(2,5);function getHomes(){try{return JSON.parse(localStorage.getItem(HS)||'[]')}catch(e){return[]}}let homes=getHomes(),active=localStorage.getItem(AS)||'';if(!homes.length){try{let h=JSON.parse(localStorage.getItem('mcb_v2_home')||'null');if(h){h.id=h.id||uid();homes=[h];active=h.id;localStorage.setItem(HS,JSON.stringify(homes));localStorage.setItem(AS,active)}}catch(e){}}function render(){app.innerHTML='<div class="card hero"><h1>🏠 Mis hogares</h1><p class="muted" style="margin-top:6px">Elige una casa o crea otra.</p></div>'+homes.map(h=>'<div class="card home '+(h.id===active?'active':'')+'"><div class="row"><div><b>'+esc(h.name||'Mi hogar')+'</b><div class="muted">'+((h.people||h.members||[]).length||1)+' personas'+(h.id===active?' · actual':'')+'</div></div><button class="btn" onclick="enterHome(\''+h.id+'\')">Entrar</button></div><div style="margin-top:10px"><button class="mini" onclick="renameHome(\''+h.id+'\')">Renombrar</button> <button class="mini" onclick="deleteHome(\''+h.id+'\')">Eliminar</button></div></div>').join('')+'<button class="btn" style="width:100%" onclick="newHome()">＋ Añadir otro hogar</button><div style="margin-top:12px"><button class="mini" onclick="location.href=\'./index.html\'">← Volver</button></div>'}function enterHome(id){let h=homes.find(x=>x.id===id);if(!h)return;active=id;localStorage.setItem(AS,id);localStorage.setItem('mcb_v2_home',JSON.stringify(h));localStorage.removeItem('mcb_v2_people');localStorage.removeItem('mcb_v2_today');localStorage.removeItem('mcb_v2_house');localStorage.removeItem('mcb_v2_laundry');location.href='./index.html?v=3'}function newHome(){let name=prompt('¿Cómo quieres llamar a esta casa?','Mi hogar');if(name===null)return;let who=prompt('¿Quién vive o participa aquí? Puedes poner los nombres separados por comas.','Yo');if(who===null)return;let people=who.split(',').map(x=>x.trim()).filter(Boolean).map((name,i)=>({id:'p'+Date.now()+i,name,participation:'normal',availability:'normal'}));let h={id:uid(),name:name.trim()||'Mi hogar',homeType:'Piso',floors:1,people:people.length?people:[{id:'me',name:'Yo',participation:'normal',availability:'normal'}],rooms:{bedrooms:2,bathrooms:1,toilets:0,living:true,kitchen:true,laundryArea:true},pets:{dog:0,cat:0},laundry:{ironing:'Algunas prendas',dryer:false,types:['Ropa normal']},organization:{days:['Lun','Mar','Mié','Jue','Vie'],minutes:60,style:'Flexible'}};homes.push(h);localStorage.setItem(HS,JSON.stringify(homes));enterHome(h.id)}function renameHome(id){let h=homes.find(x=>x.id===id);if(!h)return;let n=prompt('Nombre del hogar',h.name||'Mi hogar');if(n===null)return;h.name=n.trim()||h.name;localStorage.setItem(HS,JSON.stringify(homes));if(id===active)localStorage.setItem('mcb_v2_home',JSON.stringify(h));render()}function deleteHome(id){if(!confirm('¿Eliminar este hogar?'))return;homes=homes.filter(x=>x.id!==id);localStorage.setItem(HS,JSON.stringify(homes));if(id===active){active=homes[0]?.id||'';localStorage.setItem(AS,active)}render()}render();</script></body></html>
